
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101c2c">
<title>MiSport GPS</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:#101c2c;color:white;font-family:Arial,sans-serif}
header{text-align:center;padding:20px;background:#17283d}
h1{margin:0;color:#55e69a}
header p{color:#b8c7d8;margin-bottom:0}
main{max-width:650px;margin:auto;padding:15px}
select,button{width:100%;padding:14px;border:0;border-radius:11px;font-size:16px}
select{background:#263b53;color:white;margin:5px 0 12px}
#map{height:270px;border-radius:14px;margin-bottom:14px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:#1c3048;padding:16px 8px;border-radius:12px;text-align:center}
.stat small{color:#b8c7d8}
.stat strong{display:block;font-size:25px;margin-top:8px}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
button{font-weight:bold;cursor:pointer}
.start{background:#26d982;color:#10251c}
.pause{background:#ffc857;color:#30230a}
.stop{background:#ed6262;color:white}
.lap{background:#41658a;color:white}
button:disabled{opacity:.4}
#status{text-align:center;color:#b8c7d8;padding:10px}
.panel{background:#1c3048;padding:14px;border-radius:12px;margin-bottom:12px}
.panel label{display:block;margin:8px 0;color:#b8c7d8}
h3{margin-top:24px}
li{background:#1c3048;padding:12px;margin:8px 0;border-radius:10px}
footer{text-align:center;color:#849bb2;padding:20px}
</style>
</head>
<body>
<header>
<h1>🏃 MiSport GPS</h1>
<p>Tu entrenamiento, tus recorridos y tus récords</p>
</header>
<main>

<div class="panel">
<label>Actividad</label>
<select id="sport">
<option>🚶 Caminar</option>
<option>🏃 Correr</option>
<option>🚴 Bicicleta</option>
</select>
<label>Modalidad</label>
<select id="mode">
<option value="free">Recorrido libre</option>
<option value="circuit">Circuito con vueltas automáticas</option>
</select>
<div id="lapSettings" style="display:none">
<label>Distancia de cada vuelta</label>
<select id="lapDistance">
<option value="200">200 metros</option>
<option value="400" selected>400 metros</option>
<option value="500">500 metros</option>
<option value="1000">1 kilómetro</option>
<option value="2000">2 kilómetros</option>
</select>
</div>
</div>

<div id="map"></div>

<div class="stats">
<div class="stat"><small>DISTANCIA</small><strong id="distance">0.00 km</strong></div>
<div class="stat"><small>TIEMPO</small><strong id="time">00:00:00</strong></div>
<div class="stat"><small>VELOCIDAD</small><strong id="speed">0.0 km/h</strong></div>
<div class="stat"><small>VUELTAS</small><strong id="laps">0</strong></div>
<div class="stat"><small>ÚLTIMA VUELTA</small><strong id="lastLap">--:--</strong></div>
<div class="stat"><small>MEJOR VUELTA</small><strong id="bestLap">--:--</strong></div>
</div>

<div class="buttons">
<button class="start" id="start">▶ INICIAR</button>
<button class="pause" id="pause" disabled>Ⅱ PAUSAR</button>
<button class="lap" id="manualLap" disabled>↻ VUELTA MANUAL</button>
<button class="stop" id="stop" disabled>■ FINALIZAR</button>
</div>
<div id="status">Esperando para comenzar</div>

<h3>🏆 Historial de actividades</h3>
<ul id="history"></ul>
</main>
<footer>MiSport GPS · Tu deporte, tus marcas</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const $=id=>document.getElementById(id);
const map=L.map('map').setView([-26.83,-65.22],13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
maxZoom:19,attribution:'© OpenStreetMap'
}).addTo(map);

let active=false,paused=false,watch=null,timer=null;
let seconds=0,distance=0,lastPosition=null,lastTimestamp=0;
let line=null,marker=null,lapCount=0,lapStart=0;
let lastLapSeconds=null,bestLapSeconds=null;
let lapRecords=[];

function fmt(s){
if(s===null)return '--:--';
let h=Math.floor(s/3600),m=Math.floor(s%3600/60),v=s%60;
return h?`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(v).padStart(2,'0')}`:
`${String(m).padStart(2,'0')}:${String(v).padStart(2,'0')}`;
}
function update(){
$('distance').textContent=(distance/1000).toFixed(2)+' km';
$('time').textContent=fmt(seconds);
$('laps').textContent=lapCount;
$('lastLap').textContent=fmt(lastLapSeconds);
$('bestLap').textContent=fmt(bestLapSeconds);
}
function showHistory(){
let h=JSON.parse(localStorage.getItem('misportHistory')||'[]');
$('history').innerHTML=h.length?h.map(x=>
`<li><b>${x.sport}</b><br>${x.date}<br>${x.distance} km · ${x.time} · ${x.laps} vueltas</li>`
).join(''):'<li>Todavía no hay actividades guardadas.</li>';
}
$('mode').onchange=()=>{
$('lapSettings').style.display=$('mode').value==='circuit'?'block':'none';
};
function startTimer(){
clearInterval(timer);
timer=setInterval(()=>{seconds++;update()},1000);
}
function gpsStart(){
if(!navigator.geolocation){
$('status').textContent='Este navegador no permite GPS';return;
}
watch=navigator.geolocation.watchPosition(pos=>{
if(!active||paused)return;
let accuracy=pos.coords.accuracy;
if(accuracy>35){
$('status').textContent='Buscando mejor señal GPS... Precisión '+Math.round(accuracy)+' m';
return;
}
let p=[pos.coords.latitude,pos.coords.longitude];
let now=pos.timestamp;
if(lastPosition){
let d=map.distance(lastPosition,p);
let dt=(now-lastTimestamp)/1000;
if(d>0&&d<100&&dt>0){
distance+=d;
$('speed').textContent=(d/dt*3.6).toFixed(1)+' km/h';
if($('mode').value==='circuit'){
let lapMeters=Number($('lapDistance').value);
while(distance-lapStart>=lapMeters){
lapStart+=lapMeters;
lapCount++;
lastLapSeconds=seconds-(lapRecords.reduce((a,b)=>a+b,0));
lapRecords.push(lastLapSeconds);
if(bestLapSeconds===null||lastLapSeconds<bestLapSeconds)bestLapSeconds=lastLapSeconds;
$('status').textContent='¡Vuelta automática '+lapCount+' completada!';
}
}
}
}
lastPosition=p;lastTimestamp=now;
if(line)line.addLatLng(p);
if(!marker)marker=L.marker(p).addTo(map);
else marker.setLatLng(p);
map.setView(p,17);
$('status').textContent='GPS conectado · Precisión '+Math.round(accuracy)+' m';
update();
},err=>{
$('status').textContent='Error GPS: '+err.message+' · Revisá los permisos';
},{enableHighAccuracy:true,maximumAge:1000,timeout:20000});
}
$('start').onclick=()=>{
if(active)return;
active=true;paused=false;
seconds=0;distance=0;lapCount=0;lapStart=0;
lastLapSeconds=null;bestLapSeconds=null;lapRecords=[];
lastPosition=null;lastTimestamp=0;
if(line)map.removeLayer(line);
line=L.polyline([],{color:'#26d982',weight:5}).addTo(map);
if(marker){map.removeLayer(marker);marker=null}
$('speed').textContent='0.0 km/h';
$('start').disabled=true;$('pause').disabled=false;
$('stop').disabled=false;$('manualLap').disabled=false;
startTimer();gpsStart();
$('status').textContent='Iniciando GPS...';
};
$('pause').onclick=()=>{
if(!active)return;
if(!paused){
paused=true;clearInterval(timer);
if(watch!==null)navigator.geolocation.clearWatch(watch);
watch=null;lastPosition=null;
$('pause').textContent='▶ CONTINUAR';
$('status').textContent='Actividad pausada';
}else{
paused=false;startTimer();gpsStart();
$('pause').textContent='Ⅱ PAUSAR';
$('status').textContent='Continuando actividad';
}
};
$('manualLap').onclick=()=>{
if(!active||paused)return;
if($('mode').value==='circuit')return;
lapCount++;
$('status').textContent='Vuelta manual '+lapCount+' registrada';
update();
};
$('stop').onclick=()=>{
if(!active)return;
clearInterval(timer);
if(watch!==null)navigator.geolocation.clearWatch(watch);
watch=null;active=false;paused=false;
let record={
sport:$('sport').value,
distance:(distance/1000).toFixed(2),
time:fmt(seconds),laps:lapCount,
date:new Date().toLocaleString('es-AR')
};
if(distance>0||seconds>0){
let h=JSON.parse(localStorage.getItem('misportHistory')||'[]');
h.unshift(record);
localStorage.setItem('misportHistory',JSON.stringify(h));
}
$('start').disabled=false;$('pause').disabled=true;
$('stop').disabled=true;$('manualLap').disabled=true;
$('pause').textContent='Ⅱ PAUSAR';
$('status').textContent='Actividad finalizada. ¡Buen trabajo!';
showHistory();update();
};
showHistory();update();
</script>
</body>
</html>
